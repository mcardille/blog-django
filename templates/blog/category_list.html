{% extends 'base.html' %}

{% block content %}
    <h2>Todas as Categorias</h2>
    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'blog:category_detail' pk=category.pk %}">{{ category.name }}</a>
                 ({{ category.posts.count }} posts)
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
